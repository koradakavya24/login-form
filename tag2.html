<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Hello</p>
    <p>this is</p>
    <p>kavya</p>
    <button id="update">check</button>
    <script>
      para=document.getElementsByTagName("p")
      console.log(para)
      for(let i=0;i<para.length;i++){
        console.log(para[i].textContent)
    }
    btn=document.getElementById("update")
    btn.addEventListener("click",
    function(){
        para[0].textContent="haii"
        para[1].textContent="sheis"
        para[2].textContent="sravya"
        for(let i=0;i<para.length;i++){
            console.log(i,para[i].textContent)
        }
    }
)
</script>
</body>
</html>
